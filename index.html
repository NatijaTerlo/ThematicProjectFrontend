<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recipe Finder</title>
  <script src="script.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-2xl bg-white p-8 rounded-xl shadow-md">
  <h1 class="text-3xl font-bold mb-6 text-center">🍲 Find Recipes Based on Ingredients</h1>
  <form id="recipeForm" class="flex flex-col gap-4">
    <input
            id="ingredients"
            type="text"
            placeholder="e.g., tomato, cheese, pasta"
            class="p-3 border rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
            required
    />
    <button
            type="submit"
            class="bg-blue-500 text-white font-semibold py-2 rounded-lg hover:bg-blue-600 transition"
    >
      Search Recipes
    </button>
  </form>
  <div id="recipeResults" class="mt-6"></div>
</div>
</body>
</html>
